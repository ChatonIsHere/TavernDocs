name: Build and deploy

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            # The bot's tests, including checks against the index the build just wrote.
            - run: npm ci && npm test
              working-directory: bot
            # The site, to townshiptale.dev on Cloudflare (see wrangler.jsonc).
            - name: Deploy to Cloudflare
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              run: npx --yes wrangler@4 deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            # The old GitHub Pages address now only redirects to townshiptale.dev.
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: pages-redirect

    redirect:
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
