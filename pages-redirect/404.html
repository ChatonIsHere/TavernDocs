<!doctype html>
<!-- The docs moved to townshiptale.dev. GitHub Pages serves this for every old address, and it sends the visitor to
     the same page on the new site. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TavernDocs has moved</title>
    <meta name="robots" content="noindex">
    <script>
        var path = location.pathname.replace(/^\/TavernDocs/, '') || '/';
        location.replace('https://townshiptale.dev' + path + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://townshiptale.dev/">
    <link rel="canonical" href="https://townshiptale.dev/">
</head>
<body style="background:#15100d;color:#ede3d1;font-family:Segoe UI,sans-serif;padding:2rem">
    <p>TavernDocs has moved to <a style="color:#f0b24a" href="https://townshiptale.dev/">townshiptale.dev</a>.</p>
</body>
</html>
