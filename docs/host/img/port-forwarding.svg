<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, system-ui, sans-serif" font-size="15">
  <title>A player connects to your public IP. Your router forwards the server's ports to your PC's local IP.</title>
  <rect width="760" height="230" fill="#1f1814"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b24a"/>
    </marker>
  </defs>
  <g fill="#271e19" stroke="#806952" stroke-width="1.5">
    <rect x="20" y="60" width="170" height="110" rx="10"/>
    <rect x="295" y="40" width="170" height="150" rx="10"/>
    <rect x="570" y="60" width="170" height="110" rx="10"/>
  </g>
  <g fill="#ede3d1" text-anchor="middle">
    <text x="105" y="98" font-family="Georgia, serif" font-size="18" font-weight="bold">A player</text>
    <text x="105" y="124">anywhere on the</text>
    <text x="105" y="144">internet</text>
    <text x="380" y="78" font-family="Georgia, serif" font-size="18" font-weight="bold">Your router</text>
    <text x="380" y="102">public IP</text>
    <text x="380" y="122" fill="#f0b24a">203.0.113.10</text>
    <text x="380" y="152" font-size="13" fill="#b8a78d">forwards 1757, 1761, 1762</text>
    <text x="380" y="170" font-size="13" fill="#b8a78d">to 192.168.1.50</text>
    <text x="655" y="98" font-family="Georgia, serif" font-size="18" font-weight="bold">Your PC</text>
    <text x="655" y="124">running the server</text>
    <text x="655" y="144" fill="#f0b24a">192.168.1.50</text>
  </g>
  <g stroke="#f0b24a" stroke-width="2.5" marker-end="url(#a)">
    <line x1="192" y1="115" x2="290" y2="115"/>
    <line x1="467" y1="115" x2="565" y2="115"/>
  </g>
  <text x="380" y="218" text-anchor="middle" fill="#b8a78d" font-size="13">Your addresses will be different. These are examples.</text>
</svg>
